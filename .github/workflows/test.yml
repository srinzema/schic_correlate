name: Run Tests

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test] # Installs the package AND the pytest optional deps
          # If you didn't set up optional-dependencies, use:
          # pip install . pytest

      - name: Run Unit Tests
        run: |
          pytest tests/test_core.py
          pytest tests/test_cli.py